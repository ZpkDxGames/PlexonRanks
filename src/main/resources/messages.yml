# PlexonRanks 3.0 — every player-facing chat line
schema-version: 2
prefix: "<dark_gray>[</dark_gray><gradient:#4158D0:#C850C0><bold>PlexonRanks</bold></gradient><dark_gray>]</dark_gray> "

generic:
  no-permission: "<red>✖ You do not have permission to do that.</red>"
  players-only: "<red>✖ This command can only be used in game.</red>"
  player-not-found: "<red>✖ Player <white>%player%</white> could not be found.</red>"
  data-loading: "<yellow>◆ Your rank data is loading. Please try again in a moment.</yellow>"
  database-error: "<red>✖ The rank change could not be completed safely. Your progression remains protected; please contact staff if this continues.</red>"
  invalid-number: "<red>✖ Enter a valid positive page or amount.</red>"

rank:
  lines:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
    - "<gradient:#4158D0:#C850C0><bold>PLEXON RANKS</bold></gradient> <dark_gray>•</dark_gray> <gray>Progress overview</gray>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
    - ""
    - "<gray>Player</gray> <dark_gray>›</dark_gray> <white>%player%</white>"
    - "<gray>Current</gray> <dark_gray>›</dark_gray> %player_rank%"
    - "<gray>Next</gray> <dark_gray>›</dark_gray> %next_rank%"
    - ""
    - "%progress_bar% <white>%progress_percent%%</white>"
    - "<dark_gray>%requirements_complete%/%requirements_total% requirements ready</dark_gray>"
    - ""
    - "<gradient:#4158D0:#6C73E8><bold>REQUIREMENTS</bold></gradient>"
    - "%requirements%"
    - ""
    - "<gradient:#C850C0:#FF7EB3><bold>NEXT RANK REWARDS</bold></gradient>"
    - "%rewards%"
    - ""
    - "<click:run_command:'/rank'><hover:show_text:'<yellow>Open your Rank Dashboard</yellow>'><yellow><bold>➜ /rank</bold></yellow></hover></click> <gray>for your explicit next action.</gray>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
  max-lines:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
    - "<gradient:#4158D0:#C850C0><bold>PLEXON RANKS</bold></gradient> <dark_gray>•</dark_gray> <gray>Progress complete</gray>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
    - ""
    - "<gray>Player</gray> <dark_gray>›</dark_gray> <white>%player%</white>"
    - "<gray>Final rank</gray> <dark_gray>›</dark_gray> %player_rank%"
    - ""
    - "%progress_bar% <white>100%</white>"
    - "<gradient:#FFE98A:#FFB84D><bold>★ Every rank has been completed!</bold></gradient>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
  progress-bar:
    width: 18
    character: "■"
    filled: "<gradient:#4158D0:#C850C0>%bar%</gradient>"
    empty: "<dark_gray>%bar%</dark_gray>"

rankup:
  success: "<green>✔ Rank upgraded successfully:</green> %rank_name%<green>!</green>"
  broadcast: "<gradient:#4158D0:#C850C0><bold>%player%</bold></gradient> <gray>advanced to</gray> %rank_name%<gray>!</gray>"
  max-rank: "<gradient:#FFE98A:#FFB84D>★ You have already reached the maximum rank.</gradient>"
  requirements-not-met: "<red>✖ You still need to complete <white>%requirements_remaining%</white> requirement(s) for</red> %rank_name%<red>.</red> <click:run_command:'/rank requirements'><hover:show_text:'<gray>Open your requirements</gray>'><yellow><underlined>View requirements</underlined></yellow></hover></click>"
  already-processing: "<yellow>◆ Your previous rank-up is still being processed safely.</yellow>"
  cooldown: "<yellow>◆ Please wait <white>%seconds%s</white> before trying again.</yellow>"
  cancelled: "<red>✖ This rank-up was stopped before anything changed.</red>"
  reward-error: "<yellow>⚠ The rank-up could not finish cleanly. Your progression safety rules were applied; please contact staff before retrying if needed.</yellow>"
  title: "<gradient:#4158D0:#C850C0><bold>RANK UP!</bold></gradient>"
  subtitle: "%rank_name%"

admin:
  help:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
    - "<gradient:#4158D0:#C850C0><bold>PLEXONRANKS ADMIN</bold></gradient>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
    - "<yellow>/pranks admin</yellow> <dark_gray>—</dark_gray> <gray>Open the visual rank editor.</gray>"
    - "<yellow>/pranks info <player></yellow> <dark_gray>—</dark_gray> <gray>Inspect authoritative progression.</gray>"
    - "<yellow>/pranks history <player> [limit]</yellow> <dark_gray>—</dark_gray> <gray>Inspect bounded rank history.</gray>"
    - "<yellow>/pranks setrank <player> <rank> [confirm]</yellow>"
    - "<yellow>/pranks promote|demote <player> [amount] [confirm]</yellow>"
    - "<yellow>/pranks resetrank <player> [confirm]</yellow>"
    - "<dark_gray>Mutations require the same staged command + confirm within 30 seconds.</dark_gray>"
    - "<yellow>/pranks sync <player></yellow> <dark_gray>—</dark_gray> <gray>Reconcile PlexonRanks-owned LuckPerms projection.</gray>"
    - "<yellow>/pranks validate</yellow> <dark_gray>—</dark_gray> <gray>Validate the candidate configuration.</gray>"
    - "<yellow>/pranks reload</yellow> <dark_gray>—</dark_gray> <gray>Validate and atomically reload.</gray>"
    - "<yellow>/pranks diagnostics</yellow> <dark_gray>—</dark_gray> <gray>Inspect runtime, providers, DB and Core state.</gray>"
    - "<yellow>/pranks backup</yellow> <dark_gray>—</dark_gray> <gray>Create a safe snapshot.</gray>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
  info-lines:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
    - "<gradient:#4158D0:#C850C0><bold>PLAYER RANK</bold></gradient>"
    - "<gray>Player</gray> <dark_gray>›</dark_gray> <white>%player%</white>"
    - "<gray>Rank</gray> <dark_gray>›</dark_gray> %rank_name%"
    - "<gray>Stable ID</gray> <dark_gray>›</dark_gray> <white>%rank_id%</white>"
    - "<gray>Order</gray> <dark_gray>›</dark_gray> <white>%rank_order%</white>"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
  reload-success: "<green>✔ Configuration reloaded atomically with <white>%ranks%</white> enabled ranks.</green>"
  reload-failed: "<red>✖ Reload rejected. The previous valid configuration remains active.</red>"
  storage-restart-required: "<yellow>⚠ Storage settings changed and will apply after a server restart.</yellow>"
  validate-success: "<green>✔ All configuration files passed validation.</green>"
  validate-header: "<yellow>Validation found <red>%errors% error(s)</red> and <gold>%warnings% warning(s)</gold>:</yellow>"
  validation-error: "<red>• %source%:</red> <gray>%message%</gray>"
  validation-warning: "<yellow>• %source%:</yellow> <gray>%message%</gray>"
  setrank-usage: "<yellow>Usage: /plexonranks setrank <player> <rank> [confirm]</yellow>"
  shift-usage: "<yellow>Usage: /plexonranks %direction% <player> [amount] [confirm]</yellow>"
  player-required: "<yellow>A player name is required.</yellow>"
  setrank-success: "<green>✔ Changed <white>%player%</white> from</green> %old_rank% <green>to</green> %new_rank%<green> and reconciled the managed projection.</green>"
  sync-success: "<green>✔ PlexonRanks-owned persistent rewards synchronized for <white>%player%</white>.</green>"
  backup-success: "<green>✔ Backup created:</green> <white>%file%</white>"
  backup-failed: "<red>✖ The backup could not be created. Check the console for details.</red>"
  unknown-rank: "<red>✖ Unknown or disabled rank: <white>%rank%</white>.</red>"
  reset-confirm: "<yellow>⚠ Repeat the exact reset command with <white>confirm</white> within 30 seconds.</yellow>"
  reset-success: "<green>✔ Reset <white>%player%</white> to</green> %rank_name%<green>.</green>"
  editor-chat-prompt: "<yellow>Type the new MiniMessage/legacy value in chat, or <white>cancel</white>. This prompt expires in 60 seconds.</yellow>"
  editor-chat-expired: "<yellow>◆ The rank editor prompt expired without changing anything.</yellow>"
  editor-saved: "<green>✔ Rank configuration saved and reloaded atomically.</green>"
  editor-save-failed: "<red>✖ The edit was rejected by validation; the previous value is still active.</red>"

menu:
  editor-hint:
    - "<!italic><gray>Left-click</gray> <dark_gray>›</dark_gray> <white>Edit</white>"
    - "<!italic><gray>Shift-left</gray> <dark_gray>›</dark_gray> <white>Enable or disable</white>"
