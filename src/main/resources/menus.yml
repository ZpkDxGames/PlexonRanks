# PlexonRanks 3.0 — player and administration inventories
schema-version: 2

rank-list:
  title: "<gradient:#4158D0:#C850C0><bold>Plexon Ranks</bold></gradient> <dark_gray>•</dark_gray> <gray>%page%/%pages%</gray>"
  size: 54
  # Retained for configuration compatibility. Phase 3 progression views refresh on
  # meaningful player/menu actions rather than a repeating redraw loop.
  refresh:
    enabled: true
    interval-ticks: 60
  rank-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]

  rank-template:
    material: PAPER
    amount: 1
    glow: false
    name: "<!italic>%rank_name%"
    lore:
      - "<!italic><dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"
      - "<!italic>%status_icon% %status%"
      - "<!italic><dark_gray>Progression position #%rank_order%</dark_gray>"
      - ""
      - "%description%"
      - ""
      - "<!italic><gradient:#4158D0:#6C73E8><bold>REQUIREMENTS</bold></gradient>"
      - "%requirements%"
      - ""
      - "<!italic><gradient:#C850C0:#FF7EB3><bold>REWARDS</bold></gradient>"
      - "%rewards%"
      - ""
      - "%state_details%"
      - "<!italic><dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━</dark_gray>"

  empty:
    requirements:
      - "<!italic><dark_gray>•</dark_gray> <gray>No requirements</gray>"
    rewards:
      - "<!italic><dark_gray>•</dark_gray> <gray>No rewards</gray>"

  states:
    completed:
      material: LIME_STAINED_GLASS_PANE
      glow: false
      icon: "<green>✔</green>"
      status: "<green><bold>COMPLETED</bold></green>"
      lore:
        - "<!italic><gray>This rank is part of your completed journey.</gray>"
    current:
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      glow: true
      icon: "<aqua>◆</aqua>"
      status: "<aqua><bold>CURRENT RANK</bold></aqua>"
      lore:
        - "<!italic><aqua>You are currently at this rank.</aqua>"
    next:
      material: YELLOW_STAINED_GLASS_PANE
      glow: true
      icon: "<yellow>➜</yellow>"
      status: "<yellow><bold>NEXT RANK</bold></yellow>"
      lore:
        - "<!italic><gray>Select this rank for details and the explicit next action.</gray>"
    locked:
      material: RED_STAINED_GLASS_PANE
      glow: false
      icon: "<red>✖</red>"
      status: "<red><bold>LOCKED</bold></red>"
      lore:
        - "<!italic><gray>Complete the earlier ranks to unlock this.</gray>"
    max:
      material: NETHER_STAR
      glow: true
      icon: "<gradient:#FFE98A:#FFB84D>★</gradient>"
      status: "<gradient:#FFE98A:#FFB84D><bold>MAXIMUM RANK • MASTERED</bold></gradient>"
      lore:
        - "<!italic><gradient:#FFE98A:#FFB84D>You completed the entire progression!</gradient>"

  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  # Legacy keys remain parseable. Phase 3 uses the same bottom-row convention with
  # a Refresh control, Dashboard, explicit primary action, status, Close and paging.
  navigation:
    previous:
      slot: 45
      material: ARROW
      name: "<!italic><yellow>← Previous Page</yellow>"
      lore:
        - "<!italic><gray>Open page <white>%previous_page%</white>.</gray>"
    info:
      slot: 48
      material: EXPERIENCE_BOTTLE
      glow: true
      name: "<!italic><gradient:#4158D0:#C850C0><bold>Rank Dashboard</bold></gradient>"
      lore:
        - "<!italic><gray>Current</gray> <dark_gray>›</dark_gray> %player_rank%"
        - "<!italic><gray>Next</gray> <dark_gray>›</dark_gray> %next_rank%"
    close:
      slot: 52
      material: BARRIER
      name: "<!italic><red>Close Menu</red>"
      lore:
        - "<!italic><dark_gray>Return to the game.</dark_gray>"
    next:
      slot: 53
      material: ARROW
      name: "<!italic><yellow>Next Page →</yellow>"
      lore:
        - "<!italic><gray>Open page <white>%next_page%</white>.</gray>"

requirement-display:
  MONEY:
    completed: "<!italic><green>✔</green> <gray>Money</gray> <dark_gray>›</dark_gray> <gold>$%current%</gold> <dark_gray>/</dark_gray> <white>$%required%</white>"
    incomplete: "<!italic><red>✖</red> <gray>Money</gray> <dark_gray>›</dark_gray> <gold>$%current%</gold> <dark_gray>/</dark_gray> <white>$%required%</white> <dark_gray>(missing $%missing%)</dark_gray>"
  XP_LEVELS:
    completed: "<!italic><green>✔</green> <gray>XP Levels</gray> <dark_gray>›</dark_gray> <yellow>%current%</yellow> <dark_gray>/</dark_gray> <white>%required%</white>"
    incomplete: "<!italic><red>✖</red> <gray>XP Levels</gray> <dark_gray>›</dark_gray> <yellow>%current%</yellow> <dark_gray>/</dark_gray> <white>%required%</white>"
  PLAYTIME:
    completed: "<!italic><green>✔</green> <gray>Playtime</gray> <dark_gray>›</dark_gray> <aqua>%current_formatted%</aqua> <dark_gray>/</dark_gray> <white>%required_formatted%</white>"
    incomplete: "<!italic><red>✖</red> <gray>Playtime</gray> <dark_gray>›</dark_gray> <aqua>%current_formatted%</aqua> <dark_gray>/</dark_gray> <white>%required_formatted%</white>"
  PERMISSION:
    completed: "<!italic><green>✔</green> <gray>Special access</gray>"
    incomplete: "<!italic><red>✖</red> <gray>Special access</gray>"
  PLACEHOLDER:
    completed: "<!italic><green>✔</green> <gray>%placeholder%</gray> <dark_gray>›</dark_gray> <white>%current%</white>"
    incomplete: "<!italic><red>✖</red> <gray>%placeholder%</gray> <dark_gray>›</dark_gray> <white>%current%</white> <dark_gray>/</dark_gray> <white>%required%</white>"
  ITEM:
    completed: "<!italic><green>✔</green> <gray>%material%</gray> <dark_gray>›</dark_gray> <white>%current%</white> <dark_gray>/</dark_gray> <white>%required%</white>"
    incomplete: "<!italic><red>✖</red> <gray>%material%</gray> <dark_gray>›</dark_gray> <white>%current%</white> <dark_gray>/</dark_gray> <white>%required%</white>"

admin:
  list-title: "<gradient:#4158D0:#C850C0><bold>Rank Editor</bold></gradient> <dark_gray>•</dark_gray> <gray>%page%/%pages%</gray>"
  edit-title: "<gradient:#4158D0:#C850C0><bold>Edit %rank_short_name%</bold></gradient>"
  lore-title: "<gradient:#4158D0:#C850C0><bold>Lore</bold></gradient> <dark_gray>•</dark_gray> <gray>%rank_short_name%</gray>"
