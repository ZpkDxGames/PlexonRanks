name: Build
on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
permissions: {contents: read}
env:
  PLUGIN_VERSION: '3.0.0-rc.2'
  ACCEPTED_PHASE3_SHA: '0e5023c6e838ad064da58cf6ac8c57e06c02c5c7'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25', cache: maven}
      - name: Provision verified PlexonCore 2.0.4 API
        run: |
          set -euo pipefail
          core="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"; curl -fLsS -o "$core" https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  $core"|sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$core" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Candidate contract
        run: |
          set -euo pipefail
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" = "$PLUGIN_VERSION"
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=paper.version)" = 26.2.build.121-stable
          git merge-base --is-ancestor "$ACCEPTED_PHASE3_SHA" HEAD
      - name: Compile, test and package
        run: mvn -B -ntp clean verify
      - name: Test and distribution evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET,pathlib
          t=f=e=s=0
          for p in glob.glob('target/surefire-reports/TEST-*.xml'):
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          if not t or f or e or s: raise SystemExit(f'{t=} {f=} {e=} {s=}')
          pathlib.Path('target/TEST_SUMMARY.txt').write_text(f'TEST_COUNT={t} FAILURES={f} ERRORS={e} SKIPPED={s}\n'); print(f'TEST_COUNT={t} FAILURES={f} ERRORS={e} SKIPPED={s}')
          PY
          JAR="target/PlexonRanks-${PLUGIN_VERSION}.jar"; test -s "$JAR"; jar tf "$JAR" > target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '${PLUGIN_VERSION}'"; unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt; grep -qx 'com/zpkdxgames/plexonranks/PlexonRanksPlugin.class' target/jar-contents.txt
          for p in 'com/zpkdxgames/plexoncore/' 'net/milkbowl/vault/' 'net/luckperms/' 'me/clip/placeholderapi/' 'org/bukkit/' 'io/papermc/paper/'; do if grep -q "^$p" target/jar-contents.txt; then exit 1; fi; done
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonranks.PlexonRanksPlugin | grep -F 'major version: 69'
          (cd target && sha256sum "PlexonRanks-${PLUGIN_VERSION}.jar" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          size=$(stat -c%s "$JAR"); digest=$(sha256sum "$JAR"|awk '{print $1}'); { echo repository=$GITHUB_REPOSITORY; echo candidate_sha=$GITHUB_SHA; echo accepted_phase3=$ACCEPTED_PHASE3_SHA; echo version=$PLUGIN_VERSION; echo java=25; echo class_major=69; echo paper=26.2.build.121-stable; echo database_schema=2; echo vault=external; echo luckperms=external; echo papi=external; echo plexoncore=external; echo jar_size=$size; echo jar_sha256=$digest; echo runtime_certification=NOT_EXECUTED; } > target/PROVENANCE.txt
      - name: Whitespace
        run: git diff --check origin/main...HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonRanks-${{ env.PLUGIN_VERSION }}-${{ github.sha }}
          path: |
            target/PlexonRanks-${{ env.PLUGIN_VERSION }}.jar
            target/SHA256SUMS.txt
            target/TEST_SUMMARY.txt
            target/PROVENANCE.txt
          if-no-files-found: error
