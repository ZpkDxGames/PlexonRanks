name: PlexonHomes Permission Migration Builder

on:
  push:
    branches: [migration/plexonhomes-permissions-3.0.1]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: migration/plexonhomes-permissions-3.0.1

      - name: Apply authoritative PlexonHomes permission contract
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/migrate.py
          python3 /tmp/migrate.py

      - name: Static migration audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'plexonhomes.limit.30' src/main/resources/ranks.yml
          ! grep -q 'essentials.sethome.multiple' src/main/resources/ranks.yml
          git diff --check

      - name: Commit migration implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Migrate rank home limits to PlexonHomes'
          git push origin HEAD:migration/plexonhomes-permissions-3.0.1
