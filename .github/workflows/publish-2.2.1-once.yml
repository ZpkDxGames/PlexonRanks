name: Publish PlexonRanks 2.2.1 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-2.2.1-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision PlexonCore 2.0.4
        run: |
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl -fsSL -o "$core_jar" https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Verify
        run: mvn -B -ntp clean verify
      - name: Verify distribution
        run: |
          set -euo pipefail
          JAR=target/PlexonRanks-2.2.1.jar
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: '2.2.1'"
          if jar tf "$JAR" | grep -q '^com/zpkdxgames/plexoncore/'; then exit 1; fi
          sha256sum "$JAR" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish v2.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.1 >/dev/null 2>&1; then exit 0; fi
          gh release create v2.2.1 target/PlexonRanks-2.2.1.jar SHA256SUMS.txt --target "$GITHUB_SHA" --title 'PlexonRanks 2.2.1' --notes-file .release/2.2.1.md
