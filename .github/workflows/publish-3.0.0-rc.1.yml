name: Publish PlexonRanks 3.0.0 RC1

on:
  push:
    branches:
      - phase2/3.0.0-premium-rebuild

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for exact-head Build certification
        id: certification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            run_json=$(gh run list --workflow Build --commit "$CANDIDATE_SHA" --event push \
              --limit 10 --json databaseId,headSha,status,conclusion --jq \
              "map(select(.headSha == \"$CANDIDATE_SHA\")) | sort_by(.databaseId) | reverse | .[0] // {}")
            run_id=$(jq -r '.databaseId // empty' <<<"$run_json")
            status=$(jq -r '.status // empty' <<<"$run_json")
            conclusion=$(jq -r '.conclusion // empty' <<<"$run_json")
            if [[ -n "$run_id" && "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "Exact-head Build run $run_id concluded $conclusion" >&2
                exit 1
              fi
              echo "build_run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for exact-head Build certification' >&2
          exit 1

      - name: Require open draft Phase 2 PR for exact branch
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            pr_json=$(gh pr list --state open --base main --head phase2/3.0.0-premium-rebuild \
              --json number,isDraft --jq '.[0] // {}')
            number=$(jq -r '.number // empty' <<<"$pr_json")
            draft=$(jq -r '.isDraft // false' <<<"$pr_json")
            if [[ -n "$number" ]]; then
              head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '.head.sha')
              test "$draft" = 'true'
              test "$head" = "$CANDIDATE_SHA"
              echo "pr_number=$number" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'No open draft Phase 2 PR appeared for the exact candidate head' >&2
          exit 1

      - name: Download exact certified candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.certification.outputs.build_run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$BUILD_RUN_ID" \
            --name "PlexonRanks-3.0.0-rc.1-${GITHUB_SHA}" --dir dist
          test -s dist/PlexonRanks-3.0.0-rc.1.jar
          test -s dist/SHA256SUMS.txt
          test -s dist/TEST_SUMMARY.txt
          test -s dist/PROVENANCE.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)
          grep -Fx "COMMIT_SHA=${GITHUB_SHA}" dist/PROVENANCE.txt
          grep -F 'FAILURES=0 ERRORS=0' dist/TEST_SUMMARY.txt
          unzip -p dist/PlexonRanks-3.0.0-rc.1.jar plugin.yml | grep -F "version: '3.0.0-rc.1'"

      - name: Refuse overwrite of an existing RC tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.0.0-rc.1" >/dev/null 2>&1; then
            echo 'v3.0.0-rc.1 tag already exists; refusing to move a frozen candidate tag' >&2
            exit 1
          fi
          if gh release view v3.0.0-rc.1 >/dev/null 2>&1; then
            echo 'v3.0.0-rc.1 release already exists; refusing overwrite' >&2
            exit 1
          fi

      - name: Publish immutable RC prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v3.0.0-rc.1 \
            dist/PlexonRanks-3.0.0-rc.1.jar \
            dist/SHA256SUMS.txt \
            dist/TEST_SUMMARY.txt \
            dist/PROVENANCE.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'PlexonRanks 3.0.0-rc.1' \
            --notes-file .release/3.0.0-rc.1.md

      - name: Verify published tag and prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v3.0.0-rc.1" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
          gh release view v3.0.0-rc.1 --json isPrerelease,tagName --jq \
            'select(.isPrerelease == true and .tagName == "v3.0.0-rc.1")' >/dev/null
