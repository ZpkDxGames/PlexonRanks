name: PlexonFamily Rank Migration

on:
  push:
    branches:
      - migration/plexonfamily-rank-permissions-3.0.2

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: migration/plexonfamily-rank-permissions-3.0.2
      - name: Apply migration
        run: |
          sed -i '/^actual_essentials = /,+2d' .github/scripts/plexonfamily_rank_migration.py
          python3 .github/scripts/plexonfamily_rank_migration.py
      - name: Commit migration
        run: |
          set -euo pipefail
          git rm .github/workflows/plexonfamily-rank-migration.yml
          git rm -f .github/scripts/plexonfamily_rank_migration.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align rank rewards with PlexonFamily permissions'
          git push origin HEAD:migration/plexonfamily-rank-permissions-3.0.2
