name: Release

on:
  push:
    branches: [release/stable]

permissions:
  contents: write
  actions: read

env:
  ACCEPTED_PHASE3_SHA: '0e5023c6e838ad064da58cf6ac8c57e06c02c5c7'
  ROLLBACK_TAG: 'v2.2.1'
  ROLLBACK_SHA: '8f6fd363959041faf13399cd24bd315fa55176e8'
  CORE_SHA256: '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact stable candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision exact PlexonCore 2.0.4
        shell: bash
        run: |
          set -euo pipefail
          core="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl -fLsS --retry 3 -o "$core" https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar
          echo "$CORE_SHA256  $core" | sha256sum -c -
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true

      - name: Read project version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test -n "$VERSION"
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Verify exact stable boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PLUGIN_VERSION" != *-* ]] || { echo 'Stable version must not contain a prerelease suffix.' >&2; exit 1; }
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$MAIN_SHA"
          git merge-base --is-ancestor "$ACCEPTED_PHASE3_SHA" HEAD
          test "$(mvn -q -DforceStdout help:evaluate -Dexpression=paper.version)" = '26.2.build.121-stable'
          test -s ".release/RELEASE_NOTES_${PLUGIN_VERSION}.md"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to move a stable tag." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG release already exists; refusing replacement." >&2
            exit 1
          fi

      - name: Test and package exact stable source
        run: mvn -B -ntp clean verify

      - name: Verify exact distribution
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/PlexonRanks-${PLUGIN_VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '${PLUGIN_VERSION}'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          grep -qx 'org/sqlite/JDBC.class' target/jar-contents.txt
          grep -qx 'com/zpkdxgames/plexonranks/PlexonRanksPlugin.class' target/jar-contents.txt
          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'net/milkbowl/vault/' \
            'net/luckperms/' \
            'me/clip/placeholderapi/' \
            'org/bukkit/' \
            'io/papermc/paper/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Provided dependency shaded unexpectedly: ${prefix}" >&2
              exit 1
            fi
          done
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonranks.PlexonRanksPlugin | grep -F 'major version: 69'

      - name: Build exact release evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import pathlib
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if totals['tests'] == 0 or totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(str(totals))
          text = (f"TEST_COUNT={totals['tests']} FAILURES={totals['failures']} "
                  f"ERRORS={totals['errors']} SKIPPED={totals['skipped']}\n")
          pathlib.Path('target/TEST_SUMMARY.txt').write_text(text)
          print(text, end='')
          PY
          JAR="target/PlexonRanks-${PLUGIN_VERSION}.jar"
          (cd target && sha256sum "PlexonRanks-${PLUGIN_VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          size="$(stat -c%s "$JAR")"
          digest="$(sha256sum "$JAR" | awk '{print $1}')"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "source_sha=$GITHUB_SHA"
            echo "accepted_phase3_head=$ACCEPTED_PHASE3_SHA"
            echo "version=$PLUGIN_VERSION"
            echo 'java=25'
            echo 'class_major=69'
            echo 'paper_api=26.2.build.121-stable'
            echo 'plexoncore=2.0.4'
            echo "plexoncore_sha256=$CORE_SHA256"
            echo 'database_schema=2'
            echo 'vault=external'
            echo 'luckperms=external'
            echo 'placeholderapi=external'
            echo "rollback_tag=$ROLLBACK_TAG"
            echo "rollback_sha=$ROLLBACK_SHA"
            echo 'duplicate_consumable_item_materials=REJECTED'
            echo "jar_size=$size"
            echo "jar_sha256=$digest"
            echo 'runtime_certification=NOT_EXECUTED'
          } > target/PROVENANCE.txt

      - name: Publish GitHub stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "target/PlexonRanks-${PLUGIN_VERSION}.jar" \
            target/SHA256SUMS.txt \
            target/TEST_SUMMARY.txt \
            target/PROVENANCE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PlexonRanks ${PLUGIN_VERSION}" \
            --notes-file ".release/RELEASE_NOTES_${PLUGIN_VERSION}.md" \
            --latest

      - name: Verify published stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$GITHUB_SHA"
          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,targetCommitish,assets)"
          echo "$RELEASE_JSON" | jq -e --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" \
            '.tagName == $tag and .isPrerelease == false and .targetCommitish == $sha' >/dev/null
          ACTUAL_ASSETS="$(echo "$RELEASE_JSON" | jq -r '.assets[].name' | sort)"
          EXPECTED_ASSETS="$(printf '%s\n' "PlexonRanks-${PLUGIN_VERSION}.jar" PROVENANCE.txt SHA256SUMS.txt TEST_SUMMARY.txt | sort)"
          diff -u <(printf '%s\n' "$EXPECTED_ASSETS") <(printf '%s\n' "$ACTUAL_ASSETS")
          rm -rf published
          mkdir published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern "PlexonRanks-${PLUGIN_VERSION}.jar" \
            --pattern 'SHA256SUMS.txt' \
            --pattern 'TEST_SUMMARY.txt' \
            --pattern 'PROVENANCE.txt'
          test "$(find published -maxdepth 1 -type f | wc -l)" -eq 4
          (cd published && sha256sum --check SHA256SUMS.txt)
          grep -Fx "repository=$GITHUB_REPOSITORY" published/PROVENANCE.txt
          grep -Fx "source_sha=$GITHUB_SHA" published/PROVENANCE.txt
          grep -Fx "accepted_phase3_head=$ACCEPTED_PHASE3_SHA" published/PROVENANCE.txt
          grep -Fx "version=$PLUGIN_VERSION" published/PROVENANCE.txt
          grep -Fx 'database_schema=2' published/PROVENANCE.txt
          grep -Fx 'duplicate_consumable_item_materials=REJECTED' published/PROVENANCE.txt
          grep -Fx 'runtime_certification=NOT_EXECUTED' published/PROVENANCE.txt
          grep -Eq '^TEST_COUNT=[1-9][0-9]* FAILURES=0 ERRORS=0 SKIPPED=0$' published/TEST_SUMMARY.txt

      - name: Upload release verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: PlexonRanks-release-${{ github.sha }}
          path: |
            published/PlexonRanks-*.jar
            published/SHA256SUMS.txt
            published/TEST_SUMMARY.txt
            published/PROVENANCE.txt
          if-no-files-found: error
