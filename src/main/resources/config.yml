# PlexonRanks 3.0 — core settings
schema-version: 2

plugin:
  debug: false

# MiniMessage is the primary renderer. Legacy ampersand colors remain available for
# older rank files and may safely be used inside a MiniMessage-formatted template.
formatting:
  minimessage: true
  legacy-ampersand-support: true

rankup:
  cooldown-ms: 750
  # Legacy compatibility option. Phase 3 keeps parsing this value, but the player
  # progression path now exposes a labelled Rank Up action instead of a hidden right-click.
  right-click-next-rank: true

permissions:
  cumulative: true
  reconcile-on-join: true

storage:
  type: SQLITE
  sqlite:
    file: database.db

# Display caches are intentionally short-lived and are never authoritative for /rankup.
# SQLite remains serialized through one worker, but its queue is explicitly bounded.
performance:
  placeholder-cache-ticks: 4
  database:
    queue-capacity: 1024

integrations:
  placeholderapi: true
  discordsrv: false

broadcast:
  enabled: true

feedback:
  chat: true
  title: true
  sound: true
  broadcast: true

sounds:
  rankup:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
  denied:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.8
    pitch: 0.8

discord:
  game-channel: global
  message: "**%player%** advanced to **%rank_short_name%**!"

backup:
  keep: 10

# FAIL preserves an unknown/deleted rank row and rejects loading until an operator
# fixes the configuration/data issue. FIRST is an explicit opt-in repair to the root.
join:
  missing-rank-fallback: FAIL
