# PlexonRanks 2.2 — core settings
schema-version: 2

plugin:
  debug: false

# MiniMessage is the primary renderer. Legacy ampersand colors remain available for
# older rank files and may safely be used inside a MiniMessage-formatted template.
formatting:
  minimessage: true
  legacy-ampersand-support: true

rankup:
  cooldown-ms: 750
  right-click-next-rank: true

permissions:
  cumulative: true
  reconcile-on-join: true

storage:
  type: SQLITE
  sqlite:
    file: database.db

# Display caches are intentionally short-lived and are never authoritative for /rankup.
# SQLite remains serialized through one worker, but its queue is explicitly bounded.
performance:
  placeholder-cache-ticks: 4
  database:
    queue-capacity: 1024

integrations:
  placeholderapi: true
  discordsrv: false

broadcast:
  enabled: true

feedback:
  chat: true
  title: true
  sound: true
  broadcast: true

sounds:
  rankup:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
  denied:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.8
    pitch: 0.8

discord:
  game-channel: global
  message: "**%player%** advanced to **%rank_short_name%**!"

backup:
  keep: 10

# FIRST safely moves players to the first rank when their saved rank was deleted
# or disabled. FAIL keeps the row untouched and reports the configuration problem.
join:
  missing-rank-fallback: FIRST
